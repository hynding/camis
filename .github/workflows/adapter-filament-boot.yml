name: adapter-filament-boot
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
jobs:
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: camis
          MYSQL_ROOT_PASSWORD: camis
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: camis
          POSTGRES_PASSWORD: camis
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
      - name: Install Sanctum + Spatie, patch the User model and the admin panel as camis scaffold does
        run: |
          cd app
          php artisan install:api --no-interaction
          composer require spatie/laravel-permission --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
            import { isPatchedUserModel, patchAdminPanelProvider, patchUserModel } from './src/commands/scaffold';
            const f = process.env.GITHUB_WORKSPACE + '/app/app/Models/User.php';
            const patched = patchUserModel(readFileSync(f, 'utf8'));
            if (!isPatchedUserModel(patched)) { console.error('User model patch did not apply'); process.exit(1); }
            writeFileSync(f, patched);
            const p = process.env.GITHUB_WORKSPACE + '/app/app/Providers/Filament/AdminPanelProvider.php';
            const panel = patchAdminPanelProvider(readFileSync(p, 'utf8'));
            if (!panel.includes(\"->authGuard('admin')\")) { console.error('admin panel patch did not apply'); process.exit(1); }
            writeFileSync(p, panel);"
      - name: Overlay camis-generated files
        run: pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app"
      - name: Hook reference impl (uppercase title on publish)
        run: |
          cat > "$GITHUB_WORKSPACE/app/app/Hooks/TransformTitle.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\TransformTitleHook;
          final class TransformTitle implements TransformTitleHook
          {
              public function run(array $input): array { return ['title' => strtoupper($input['title'])]; }
          }
          PHP
      - name: Lifecycle, policy, middleware and schedule reference impls
        run: |
          H="$GITHUB_WORKSPACE/app/app/Hooks"
          cat > "$H/DefaultStatus.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\DefaultStatusHook;
          final class DefaultStatus implements DefaultStatusHook
          {
              public function run(array $input): array { return ['status' => 'draft']; }
          }
          PHP
          cat > "$H/ForgetArticle.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\ForgetArticleHook;
          final class ForgetArticle implements ForgetArticleHook
          {
              public function run(array $input): void { cache()->forever('forgotten', $input['title']); }
          }
          PHP
          cat > "$H/NoDeletes.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\NoDeletesPolicy;
          use Illuminate\Http\Request;
          final class NoDeletes implements NoDeletesPolicy
          {
              public function allows(Request $request, string $action): bool { return false; }
          }
          PHP
          cat > "$H/TagResponse.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\TagResponseMiddleware;
          use Closure;
          use Illuminate\Http\Request;
          use Symfony\Component\HttpFoundation\Response;
          final class TagResponse implements TagResponseMiddleware
          {
              public function handle(Request $request, Closure $next): Response
              {
                  $response = $next($request);
                  $response->headers->set('X-Camis-Hook', 'TagResponse');
                  return $response;
              }
          }
          PHP
          cat > "$H/Heartbeat.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\HeartbeatTask;
          final class Heartbeat implements HeartbeatTask
          {
              public function run(): void { cache()->forever('heartbeat', 'beat'); }
          }
          PHP
      - name: Load the IR's schedules from routes/console.php as camis scaffold does
        run: >-
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
          import { patchConsoleRoutes } from './src/commands/scaffold';
          const f = process.env.GITHUB_WORKSPACE + '/app/routes/console.php';
          writeFileSync(f, patchConsoleRoutes(readFileSync(f, 'utf8')));"
      - name: Configure DB env (${{ matrix.db }})
        run: |
          cd app
          case "${{ matrix.db }}" in
            sqlite) echo "DB_CONNECTION=sqlite" >> .env; touch database/database.sqlite ;;
            mysql)  printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=camis\nDB_USERNAME=root\nDB_PASSWORD=camis\n' >> .env ;;
            pgsql)  printf 'DB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=camis\nDB_USERNAME=postgres\nDB_PASSWORD=camis\n' >> .env ;;
          esac
      - name: Migrate + seed + enforce
        run: |
          cd app
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          php artisan about
          php artisan tinker --execute='
            $u = \App\Models\User::factory()->create();
            $u->assignRole("Editor");
            $published = new \App\Models\Article(["status" => "published"]);
            $draft = new \App\Models\Article(["status" => "draft"]);
            $allow = \Illuminate\Support\Facades\Gate::forUser($u)->allows("view", $published);
            $deny = \Illuminate\Support\Facades\Gate::forUser($u)->allows("view", $draft);
            if ($allow !== true || $deny !== false) { fwrite(STDERR, "ENFORCEMENT MISMATCH allow=".var_export($allow,true)." deny=".var_export($deny,true)."\n"); exit(1); }
            echo "ENFORCEMENT OK\n";
            $art = \App\Models\Article::create(["title" => "hello"]);
            $art->published_at = now(); $art->save();
            if ($art->fresh()->title !== "HELLO") { fwrite(STDERR, "HOOK MISMATCH title=".$art->fresh()->title."\n"); exit(1); }
            echo "HOOK OK\n";
            $fresh = \App\Models\Article::create(["title" => "lifecycle"]);
            if ($fresh->fresh()->status !== "draft") { fwrite(STDERR, "BEFORE CREATE MISMATCH status=".$fresh->fresh()->status."\n"); exit(1); }
            $fresh->delete();
            if (cache("forgotten") !== "lifecycle") { fwrite(STDERR, "AFTER DELETE MISMATCH\n"); exit(1); }
            echo "LIFECYCLE OK\n";
            $kernel = app(\Illuminate\Contracts\Http\Kernel::class);
            auth()->login($u);
            $list = $kernel->handle(\Illuminate\Http\Request::create("/api/articles", "GET", server: ["HTTP_ACCEPT" => "application/json"]));
            $delete = $kernel->handle(\Illuminate\Http\Request::create("/api/articles/".$art->id, "DELETE", server: ["HTTP_ACCEPT" => "application/json"]));
            $seen = [$list->getStatusCode(), $list->headers->get("X-Camis-Hook"), $delete->getStatusCode(), json_decode((string) $delete->getContent(), true)["message"] ?? null, \App\Models\Article::whereKey($art->id)->exists()];
            if ($seen !== [200, "TagResponse", 403, "Policy Failed", true]) { fwrite(STDERR, "ROUTE HOOKS MISMATCH ".json_encode($seen)."\n"); exit(1); }
            // Strapi checks the permission before the policies: a Reader holds no delete, so it is refused before NoDeletes is asked.
            $reader = \App\Models\User::factory()->create();
            $reader->assignRole("Reader");
            auth()->forgetGuards();
            auth()->login($reader);
            $refused = $kernel->handle(\Illuminate\Http\Request::create("/api/articles/".$art->id, "DELETE", server: ["HTTP_ACCEPT" => "application/json"]));
            $seen = [$refused->getStatusCode(), json_decode((string) $refused->getContent(), true)["message"] ?? null];
            if ($seen[0] !== 403 || $seen[1] === "Policy Failed") { fwrite(STDERR, "ROUTE HOOKS ORDER MISMATCH ".json_encode($seen)."\n"); exit(1); }
            echo "ROUTE HOOKS OK\n";
          '
      - name: Schedules run through Laravel's scheduler
        run: |
          cd app
          php artisan schedule:list | tee $RUNNER_TEMP/schedule.txt
          grep -q "Heartbeat" $RUNNER_TEMP/schedule.txt
          php artisan schedule:run
          [ "$(php artisan tinker --execute='echo cache("heartbeat");')" = "beat" ] || { echo "the Heartbeat schedule did not run"; exit 1; }
      - name: Admin access (an admin account with an admin role signs in; camis:admin makes the first; an API user never does)
        run: |
          cd app
          php artisan camis:admin first@example.test --name=First --password=first-admin-pass
          if php artisan camis:admin second@example.test --password=second-pass --role=Reader; then echo "camis:admin gave a role that is not an admin role"; exit 1; fi
          if php artisan camis:admin third@example.test --password=short; then echo "camis:admin took a short password"; exit 1; fi
          php artisan tinker --execute='
            $panel = \Filament\Facades\Filament::getPanel("admin");
            $first = \App\Models\AdminUser::where("email", "first@example.test")->firstOrFail();
            $reader = \App\Models\AdminUser::forceCreate(["email" => "reader@example.test", "is_active" => true]);
            $reader->assignRole("Reader");
            $asleep = \App\Models\AdminUser::forceCreate(["email" => "asleep@example.test", "is_active" => false]);
            $asleep->assignRole("Editor");
            $apiUser = \App\Models\User::factory()->create(["email" => "api@example.test", "password" => \Illuminate\Support\Facades\Hash::make("api-user-pass")]);
            $apiUser->assignRole("Editor");
            $seen = [$first->hasRole("Editor"), $first->canAccessPanel($panel), $reader->canAccessPanel($panel), $asleep->canAccessPanel($panel), \App\Models\AdminUser::where("email", "second@example.test")->exists(), \App\Models\User::where("email", "first@example.test")->exists(), $panel->getAuthGuard(), \Illuminate\Support\Facades\Auth::guard("admin")->validate(["email" => "api@example.test", "password" => "api-user-pass"]), \Illuminate\Support\Facades\Auth::guard("admin")->validate(["email" => "first@example.test", "password" => "first-admin-pass"])];
            if ($seen !== [true, true, false, false, false, false, "admin", false, true]) { fwrite(STDERR, "ADMIN ACCESS MISMATCH ".json_encode($seen)."\n"); exit(1); }
            echo "ADMIN ACCESS OK\n";
          '
  runtime-phpstan:
    # The runtime PHP the generator copies (src/strapi-api/<package>/php/), analysed inside the
    # Laravel app it runs in so Eloquent, Filament and the generated classes it calls resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5 + API + Spatie + GraphQL + Strapi storage deps + Larastan
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
          php artisan install:api --no-interaction
          composer require spatie/laravel-permission webonyx/graphql-php:"^15.19" firebase/php-jwt visus/cuid2 --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          composer require --dev larastan/larastan:"^3.0" --no-interaction
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
            import { isPatchedUserModel, patchAdminPanelProvider, patchUserModel } from './src/commands/scaffold';
            const f = process.env.GITHUB_WORKSPACE + '/app/app/Models/User.php';
            const patched = patchUserModel(readFileSync(f, 'utf8'));
            if (!isPatchedUserModel(patched)) { console.error('User model patch did not apply'); process.exit(1); }
            writeFileSync(f, patched);
            const p = process.env.GITHUB_WORKSPACE + '/app/app/Providers/Filament/AdminPanelProvider.php';
            const panel = patchAdminPanelProvider(readFileSync(p, 'utf8'));
            if (!panel.includes(\"->authGuard('admin')\")) { console.error('admin panel patch did not apply'); process.exit(1); }
            writeFileSync(p, panel);"
      - name: Overlay the Strapi API style on both storage layouts
        run: |
          cp -r app app-storage
          pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app" --style strapi
          pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app-storage" --style strapi --storage strapi
      - name: PHPStan over the runtime PHP
        run: bash packages/adapter-filament/scripts/runtime-phpstan.sh app app-storage
  author-role:
    # Strapi's default Author and Editor admin roles: the Author is held to the entries it created
    # (admin::is-creator). The test runs on :memory: sqlite, so one database is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5 + API + Spatie + GraphQL
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
          php artisan install:api --no-interaction
          composer require spatie/laravel-permission --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          composer require webonyx/graphql-php:"^15.19" --no-interaction
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
            import { isPatchedUserModel, patchAdminPanelProvider, patchUserModel } from './src/commands/scaffold';
            const f = process.env.GITHUB_WORKSPACE + '/app/app/Models/User.php';
            const patched = patchUserModel(readFileSync(f, 'utf8'));
            if (!isPatchedUserModel(patched)) { console.error('User model patch did not apply'); process.exit(1); }
            writeFileSync(f, patched);
            const p = process.env.GITHUB_WORKSPACE + '/app/app/Providers/Filament/AdminPanelProvider.php';
            const panel = patchAdminPanelProvider(readFileSync(p, 'utf8'));
            if (!panel.includes(\"->authGuard('admin')\")) { console.error('admin panel patch did not apply'); process.exit(1); }
            writeFileSync(p, panel);"
      - name: Overlay (apiStyle strapi, the author-role fixture)
        run: pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app" --style strapi --bundle author-role
      - name: Patch bootstrap/app.php as camis scaffold does
        run: >-
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
          import { patchBootstrapExceptions, patchBootstrapGraphql, patchBootstrapMiddleware, patchBootstrapTransfer } from './src/commands/scaffold';
          const f = process.env.GITHUB_WORKSPACE + '/app/bootstrap/app.php';
          writeFileSync(f, patchBootstrapExceptions(patchBootstrapGraphql(patchBootstrapTransfer(patchBootstrapMiddleware(readFileSync(f, 'utf8'))))));"
      - name: An Author lists, opens and changes only the entries it created; an Editor every one; anyone reads a route Strapi opens with auth false; custom routes reach their handlers
        run: |
          cd app
          echo "DB_CONNECTION=sqlite" >> .env
          touch database/database.sqlite
          php artisan migrate --force
          cp ../packages/adapter-filament/scripts/php/AuthorRoleTest.php ../packages/adapter-filament/scripts/php/PublicActionsTest.php ../packages/adapter-filament/scripts/php/EndpointsTest.php tests/Feature/
          php artisan test tests/Feature/AuthorRoleTest.php tests/Feature/PublicActionsTest.php tests/Feature/EndpointsTest.php
  strapi-api:
    runs-on: ubuntu-latest
    # The REST and populate vectors build SQL per dialect (LIKE escapes, casts, relation
    # subqueries), so they run on all three databases.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: camis
          MYSQL_ROOT_PASSWORD: camis
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: camis
          POSTGRES_PASSWORD: camis
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5 + API + Spatie
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
          php artisan install:api --no-interaction
          composer require spatie/laravel-permission --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          composer require webonyx/graphql-php:"^15.19" --no-interaction
          cd "$GITHUB_WORKSPACE"
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
            import { isPatchedUserModel, patchAdminPanelProvider, patchUserModel } from './src/commands/scaffold';
            const f = process.env.GITHUB_WORKSPACE + '/app/app/Models/User.php';
            const patched = patchUserModel(readFileSync(f, 'utf8'));
            if (!isPatchedUserModel(patched)) { console.error('User model patch did not apply'); process.exit(1); }
            writeFileSync(f, patched);
            const p = process.env.GITHUB_WORKSPACE + '/app/app/Providers/Filament/AdminPanelProvider.php';
            const panel = patchAdminPanelProvider(readFileSync(p, 'utf8'));
            if (!panel.includes(\"->authGuard('admin')\")) { console.error('admin panel patch did not apply'); process.exit(1); }
            writeFileSync(p, panel);"
      - name: Overlay (apiStyle strapi)
        run: pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app" --style strapi
      - name: Patch bootstrap/app.php as camis scaffold does
        run: >-
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
          import { patchBootstrapExceptions, patchBootstrapGraphql, patchBootstrapMiddleware, patchBootstrapTransfer } from './src/commands/scaffold';
          const f = process.env.GITHUB_WORKSPACE + '/app/bootstrap/app.php';
          writeFileSync(f, patchBootstrapExceptions(patchBootstrapGraphql(patchBootstrapTransfer(patchBootstrapMiddleware(readFileSync(f, 'utf8'))))));"
      - name: Migrate + seed + cache (as a shared-host deploy does) + serve (${{ matrix.db }})
        run: |
          cd app
          grep -q "prependToGroup('api'" bootstrap/app.php || { echo "bootstrap/app.php patch did not apply"; exit 1; }
          grep -q "routes/graphql.php" bootstrap/app.php || { echo "bootstrap/app.php graphql patch did not apply"; exit 1; }
          grep -q "routes/transfer.php" bootstrap/app.php || { echo "bootstrap/app.php transfer patch did not apply"; exit 1; }
          grep -q "Integration::handles" bootstrap/app.php || { echo "bootstrap/app.php Sentry patch did not apply"; exit 1; }
          case "${{ matrix.db }}" in
            sqlite) echo "DB_CONNECTION=sqlite" >> .env; touch database/database.sqlite ;;
            mysql)  printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=camis\nDB_USERNAME=root\nDB_PASSWORD=camis\n' >> .env ;;
            pgsql)  printf 'DB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=camis\nDB_USERNAME=postgres\nDB_PASSWORD=camis\n' >> .env ;;
          esac
          # The auth vectors make more credential requests in a minute than the default allows.
          echo "CAMIS_AUTH_THROTTLE_PER_MINUTE=600" >> .env
          # The OAuth redirect URI is built from it, and the vectors mask the origin they call.
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8765#' .env
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan view:cache
          (php artisan serve --host=127.0.0.1 --port=8765 > serve.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/api/_health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8765/api/_health || { cat serve.log; exit 1; }
      - name: HTTP round trip
        run: bash packages/adapter-filament/scripts/strapi-api-smoke.sh http://127.0.0.1:8765/api
      - name: Strapi REST query vectors (also pass against strapi-php)
        run: |
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"vectors","email":"vectors@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          bash packages/adapter-filament/scripts/strapi-rest-vectors.sh http://127.0.0.1:8765/api "$T"
      - name: Strapi populate and relation vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"populate","email":"populate@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api --token "$T"
      - name: Strapi relations to users, REST and GraphQL (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"relations","email":"relations@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api \
            --token "$T" --vectors $F/user-relation-vectors.json --expected $F/user-relation-vectors.expected.json
      - name: Strapi private fields, REST and GraphQL (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
