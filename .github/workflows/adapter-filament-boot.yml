      - name: Filament admin publishes drafts, translates, keeps the media library and its folders, manages users, API and transfer tokens, exports and imports Strapi archives, builds dynamic zones, links inside components and nested repeatables, keeps link order, imports Strapi's tokens, searches, sorts, filters, deletes, duplicates and bulk-publishes lists, makes uids, records creators and lays views out as configured, sends email for a token holding the action, shows and (in development) edits the content model in the Content-Type Builder, keeps admin accounts apart and signs them in through Strapi's admin API; GraphQL refuses what REST refuses
        run: |
          cd app
          # The cached config would point the tests at the served database instead of :memory:.
          php artisan config:clear
          S=../packages/adapter-filament/scripts/php
          cp $S/DraftAdminTest.php $S/LocaleAdminTest.php $S/MediaAdminTest.php $S/FoldersTest.php $S/UsersAdminTest.php $S/ProvidersTest.php $S/ApiTokensTest.php $S/TransferTokensTest.php $S/DataTransferTest.php $S/StrapiAdminTest.php $S/WebhooksTest.php $S/DynamicZonesTest.php $S/GraphqlTest.php $S/LinkOrderAdminTest.php $S/TokenImportTest.php $S/ContentManagerListTest.php $S/ComponentIdTest.php $S/ComponentRelationsAdminTest.php $S/ContentManagerViewTest.php $S/SettingsPagesTest.php $S/EmailApiTest.php $S/ContentTypeBuilderTest.php $S/AdminAccountsTest.php tests/Feature/
          php artisan test tests/Feature/DraftAdminTest.php tests/Feature/LocaleAdminTest.php tests/Feature/MediaAdminTest.php tests/Feature/FoldersTest.php tests/Feature/UsersAdminTest.php tests/Feature/ProvidersTest.php tests/Feature/ApiTokensTest.php tests/Feature/TransferTokensTest.php tests/Feature/DataTransferTest.php tests/Feature/StrapiAdminTest.php tests/Feature/WebhooksTest.php tests/Feature/DynamicZonesTest.php tests/Feature/GraphqlTest.php tests/Feature/LinkOrderAdminTest.php tests/Feature/TokenImportTest.php tests/Feature/ContentManagerListTest.php tests/Feature/ComponentIdTest.php tests/Feature/ComponentRelationsAdminTest.php tests/Feature/ContentManagerViewTest.php tests/Feature/SettingsPagesTest.php tests/Feature/EmailApiTest.php tests/Feature/ContentTypeBuilderTest.php tests/Feature/AdminAccountsTest.php
      - name: camis:schema-sync brings the database up to the generated migrations and keeps its rows (${{ matrix.db }})
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan tinker --execute='require "../packages/adapter-filament/scripts/php/schema-sync-check.php";' | tee "$RUNNER_TEMP/schema-sync.log"
          grep -q "SCHEMA SYNC OK" "$RUNNER_TEMP/schema-sync.log"
      - name: Server log on failure
        if: failure()
        run: cat app/serve.log app/storage/logs/laravel.log "$RUNNER_TEMP/oauth/serve.log" || true
