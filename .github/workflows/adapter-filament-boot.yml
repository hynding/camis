name: adapter-filament-boot
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 6 * * *"
jobs:
  boot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: camis
          MYSQL_ROOT_PASSWORD: camis
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: camis
          POSTGRES_PASSWORD: camis
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
      - name: Install Spatie + HasRoles
        run: |
          cd app
          composer require spatie/laravel-permission --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          php -r '$f="app/Models/User.php";$c=file_get_contents($f);$c=str_replace("use HasFactory, Notifiable;","use HasFactory, Notifiable, \\Spatie\\Permission\\Traits\\HasRoles;",$c);file_put_contents($f,$c);'
          grep -q HasRoles app/Models/User.php || { echo "User model patch did not apply"; exit 1; }
      - name: Overlay camis-generated files
        run: pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app"
      - name: Hook reference impl (uppercase title on publish)
        run: |
          cat > "$GITHUB_WORKSPACE/app/app/Hooks/TransformTitle.php" <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App\Hooks;
          use App\Hooks\Contracts\TransformTitleHook;
          final class TransformTitle implements TransformTitleHook
          {
              public function run(array $input): array { return ['title' => strtoupper($input['title'])]; }
          }
          PHP
      - name: Configure DB env (${{ matrix.db }})
        run: |
          cd app
          case "${{ matrix.db }}" in
            sqlite) echo "DB_CONNECTION=sqlite" >> .env; touch database/database.sqlite ;;
            mysql)  printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=camis\nDB_USERNAME=root\nDB_PASSWORD=camis\n' >> .env ;;
            pgsql)  printf 'DB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=camis\nDB_USERNAME=postgres\nDB_PASSWORD=camis\n' >> .env ;;
          esac
      - name: Migrate + seed + enforce
        run: |
          cd app
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          php artisan about
          php artisan tinker --execute='
            $u = \App\Models\User::factory()->create();
            $u->assignRole("Editor");
            $published = new \App\Models\Article(["status" => "published"]);
            $draft = new \App\Models\Article(["status" => "draft"]);
            $allow = \Illuminate\Support\Facades\Gate::forUser($u)->allows("view", $published);
            $deny = \Illuminate\Support\Facades\Gate::forUser($u)->allows("view", $draft);
            if ($allow !== true || $deny !== false) { fwrite(STDERR, "ENFORCEMENT MISMATCH allow=".var_export($allow,true)." deny=".var_export($deny,true)."\n"); exit(1); }
            echo "ENFORCEMENT OK\n";
            $art = \App\Models\Article::create(["title" => "hello"]);
            $art->published_at = now(); $art->save();
            if ($art->fresh()->title !== "HELLO") { fwrite(STDERR, "HOOK MISMATCH title=".$art->fresh()->title."\n"); exit(1); }
            echo "HOOK OK\n";
          '
  strapi-api:
    runs-on: ubuntu-latest
    # The REST and populate vectors build SQL per dialect (LIKE escapes, casts, relation
    # subqueries), so they run on all three databases.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: camis
          MYSQL_ROOT_PASSWORD: camis
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: camis
          POSTGRES_PASSWORD: camis
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Scaffold Laravel 12 + Filament v5 + API + Spatie
        run: |
          composer create-project laravel/laravel:^12 app --no-interaction
          cd app
          composer require filament/filament:"^5.0" --no-interaction
          php artisan filament:install --panels --no-interaction
          php artisan install:api --no-interaction
          composer require spatie/laravel-permission --no-interaction
          php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider" --no-interaction
          php -r '$f="app/Models/User.php";$c=file_get_contents($f);$c=str_replace("use HasFactory, Notifiable;","use HasFactory, Notifiable, \\Spatie\\Permission\\Traits\\HasRoles, \\Laravel\\Sanctum\\HasApiTokens;",$c);file_put_contents($f,$c);'
          grep -q HasApiTokens app/Models/User.php || { echo "User model patch did not apply"; exit 1; }
      - name: Overlay (apiStyle strapi)
        run: pnpm --filter @camis/adapter-filament overlay "$GITHUB_WORKSPACE/app" --style strapi
      - name: Patch bootstrap/app.php as camis scaffold does
        run: >-
          pnpm --filter @camis/cli exec tsx -e "import { readFileSync, writeFileSync } from 'node:fs';
          import { patchBootstrapMiddleware } from './src/commands/scaffold';
          const f = process.env.GITHUB_WORKSPACE + '/app/bootstrap/app.php';
          writeFileSync(f, patchBootstrapMiddleware(readFileSync(f, 'utf8')));"
      - name: Migrate + seed + cache (as a shared-host deploy does) + serve (${{ matrix.db }})
        run: |
          cd app
          grep -q "prependToGroup('api'" bootstrap/app.php || { echo "bootstrap/app.php patch did not apply"; exit 1; }
          case "${{ matrix.db }}" in
            sqlite) echo "DB_CONNECTION=sqlite" >> .env; touch database/database.sqlite ;;
            mysql)  printf 'DB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=camis\nDB_USERNAME=root\nDB_PASSWORD=camis\n' >> .env ;;
            pgsql)  printf 'DB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=camis\nDB_USERNAME=postgres\nDB_PASSWORD=camis\n' >> .env ;;
          esac
          # The auth vectors make more credential requests in a minute than the default allows.
          echo "CAMIS_AUTH_THROTTLE_PER_MINUTE=600" >> .env
          # The OAuth redirect URI is built from it, and the vectors mask the origin they call.
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8765#' .env
          php artisan migrate --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          php artisan view:cache
          (php artisan serve --host=127.0.0.1 --port=8765 > serve.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8765/api/_health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8765/api/_health || { cat serve.log; exit 1; }
      - name: HTTP round trip
        run: bash packages/adapter-filament/scripts/strapi-api-smoke.sh http://127.0.0.1:8765/api
      - name: Strapi REST query vectors (also pass against strapi-php)
        run: |
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"vectors","email":"vectors@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          bash packages/adapter-filament/scripts/strapi-rest-vectors.sh http://127.0.0.1:8765/api "$T"
      - name: Strapi populate and relation vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"populate","email":"populate@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api --token "$T"
      - name: Strapi Draft & Publish vectors (recorded from strapi-php) and the publish grant
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          register() {
            curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data "{\"username\":\"$1\",\"email\":\"$1@example.test\",\"password\":\"secret1\"}" \
              http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt
          }
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api \
            --token "$(register drafts)" \
            --vectors $F/draft-publish-vectors.json --expected $F/draft-publish-vectors.expected.json
          # A caller who may write Posts but not publish them.
          W=$(register writer)
          php artisan tinker --execute='\Spatie\Permission\Models\Role::findOrCreate("writer")->givePermissionTo(["post.create", "post.read", "post.update"]); \App\Models\User::where("username", "writer")->firstOrFail()->syncRoles(["writer"]);'
          bash ../packages/adapter-filament/scripts/strapi-publish-grant.sh http://127.0.0.1:8765/api "$W"
      - name: Strapi i18n vectors (recorded from strapi-php, locales en and fr)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          php artisan tinker --execute='\App\Models\Locale::create(["code" => "fr", "name" => "French (fr)"]);'
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"locales","email":"locales@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api \
            --token "$T" --vectors $F/i18n-vectors.json --expected $F/i18n-vectors.expected.json
      - name: Strapi media and Upload API vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"media","email":"media@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api \
            --token "$T" --vectors $F/media-vectors.json --expected $F/media-vectors.expected.json
      - name: Strapi dynamic zone vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          T=$(curl -s -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"username":"zones","email":"zones@example.test","password":"secret1"}' \
            http://127.0.0.1:8765/api/auth/local/register | jq -r .jwt)
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-populate-vectors.mjs http://127.0.0.1:8765/api \
            --token "$T" --vectors $F/dynamic-zone-vectors.json --expected $F/dynamic-zone-vectors.expected.json
      - name: Strapi users-permissions vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          node ../packages/adapter-filament/scripts/strapi-auth-vectors.mjs http://127.0.0.1:8765/api \
            --hook "bash ../packages/adapter-filament/scripts/strapi-auth-hook.sh"
      - name: Strapi sign-in provider vectors (recorded from strapi-php against a stand-in provider)
        run: |
          bash packages/adapter-filament/scripts/fake-oauth-cert.sh "$RUNNER_TEMP/oauth"
          sudo cp "$RUNNER_TEMP/oauth/fake-oauth.crt" /usr/local/share/ca-certificates/camis-fake-oauth.crt
          sudo update-ca-certificates
          (node packages/adapter-filament/scripts/fake-oauth-provider.mjs --cert "$RUNNER_TEMP/oauth/fake-oauth.crt" --key "$RUNNER_TEMP/oauth/fake-oauth.key" > "$RUNNER_TEMP/oauth/serve.log" 2>&1 &)
          for _ in $(seq 1 30); do curl -s -o /dev/null https://127.0.0.1:9443/cognito/jwks && break; sleep 1; done
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-auth-vectors.mjs http://127.0.0.1:8765/api \
            --hook "bash ../packages/adapter-filament/scripts/strapi-auth-hook.sh" \
            --vectors $F/oauth-vectors.json --expected $F/oauth-vectors.expected.json
      - name: Strapi API token vectors (recorded from strapi-php)
        run: |
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-auth-vectors.mjs http://127.0.0.1:8765/api \
            --hook "bash ../packages/adapter-filament/scripts/strapi-auth-hook.sh" \
            --vectors $F/token-vectors.json --expected $F/token-vectors.expected.json
      - name: Strapi webhook vectors (recorded from strapi-php)
        run: |
          (node packages/adapter-filament/scripts/webhook-receiver.mjs > "$RUNNER_TEMP/webhook-receiver.log" 2>&1 &)
          cd app
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-auth-vectors.mjs http://127.0.0.1:8765/api \
            --hook "bash ../packages/adapter-filament/scripts/strapi-auth-hook.sh" \
            --vectors $F/webhook-vectors.json --expected $F/webhook-vectors.expected.json
      - name: Strapi refresh-token session vectors (recorded from strapi-php in refresh mode)
        run: |
          cd app
          echo "CAMIS_JWT_MANAGEMENT=refresh" >> .env
          php artisan config:cache
          php artisan migrate:fresh --force
          php artisan db:seed --class="Database\\Seeders\\RolePermissionSeeder" --force
          F=../packages/adapter-filament/src/strapi-api/__fixtures__
          node ../packages/adapter-filament/scripts/strapi-auth-vectors.mjs http://127.0.0.1:8765/api \
            --hook "bash ../packages/adapter-filament/scripts/strapi-auth-hook.sh" \
            --vectors $F/session-vectors.json --expected $F/session-vectors.expected.json
      - name: Filament admin publishes drafts, translates, keeps the media library, manages users and API tokens
        run: |
          cd app
          # The cached config would point the tests at the served database instead of :memory:.
          php artisan config:clear
          S=../packages/adapter-filament/scripts/php
          cp $S/DraftAdminTest.php $S/LocaleAdminTest.php $S/MediaAdminTest.php $S/UsersAdminTest.php $S/ProvidersTest.php $S/ApiTokensTest.php $S/WebhooksTest.php tests/Feature/
          php artisan test tests/Feature/DraftAdminTest.php tests/Feature/LocaleAdminTest.php tests/Feature/MediaAdminTest.php tests/Feature/UsersAdminTest.php tests/Feature/ProvidersTest.php tests/Feature/ApiTokensTest.php tests/Feature/WebhooksTest.php
      - name: Server log on failure
        if: failure()
        run: cat app/serve.log app/storage/logs/laravel.log "$RUNNER_TEMP/oauth/serve.log" || true
