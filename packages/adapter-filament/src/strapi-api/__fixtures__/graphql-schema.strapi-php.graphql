  pageInfo: Pagination!
}

type BookEntityResponseCollection {
  nodes: [Book!]!
  pageInfo: Pagination!
}

type CategoryEntityResponseCollection {
  nodes: [Category!]!
  pageInfo: Pagination!
}

type GenreEntityResponseCollection {
  nodes: [Genre!]!
  pageInfo: Pagination!
}

input LandingFiltersInput {
  documentId: IDFilterInput
  title: StringFilterInput
  createdAt: DateTimeFilterInput
  updatedAt: DateTimeFilterInput
  publishedAt: DateTimeFilterInput
  and: [LandingFiltersInput]
  or: [LandingFiltersInput]
  not: LandingFiltersInput
}

type LandingEntityResponseCollection {
  nodes: [Landing!]!
  pageInfo: Pagination!
}

type PageEntityResponseCollection {
  nodes: [Page!]!
  pageInfo: Pagination!
}

input PostFiltersInput {
  documentId: IDFilterInput
  title: StringFilterInput
  views: IntFilterInput
  topics: TopicFiltersInput
  author: AuthorFiltersInput
  createdAt: DateTimeFilterInput
  updatedAt: DateTimeFilterInput
  publishedAt: DateTimeFilterInput
  and: [PostFiltersInput]
  or: [PostFiltersInput]
  not: PostFiltersInput
}

type PostEntityResponseCollection {
  nodes: [Post!]!
  pageInfo: Pagination!
}

type TopicEntityResponseCollection {
  nodes: [Topic!]!
  pageInfo: Pagination!
}

type UsersPermissionsMe {
  id: ID!
  documentId: ID!
  username: String!
  email: String
  confirmed: Boolean
  blocked: Boolean
  role: UsersPermissionsMeRole
}

type UsersPermissionsMeRole {
  id: ID!
  name: String!
  description: String
  type: String
}

type Mutation {
  createArticle(
    status: PublicationStatus = PUBLISHED
    data: ArticleInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Article
  updateArticle(
    documentId: ID!
    status: PublicationStatus = PUBLISHED
    data: ArticleInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Article
  deleteArticle(
    documentId: ID!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): DeleteMutationResponse
  createAuthor(status: PublicationStatus = PUBLISHED, data: AuthorInput!): Author
  updateAuthor(documentId: ID!, status: PublicationStatus = PUBLISHED, data: AuthorInput!): Author
  deleteAuthor(documentId: ID!): DeleteMutationResponse
  createBook(status: PublicationStatus = PUBLISHED, data: BookInput!): Book
  updateBook(documentId: ID!, status: PublicationStatus = PUBLISHED, data: BookInput!): Book
  deleteBook(documentId: ID!): DeleteMutationResponse
  createCategory(
    status: PublicationStatus = PUBLISHED
    data: CategoryInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Category
  updateCategory(
    documentId: ID!
    status: PublicationStatus = PUBLISHED
    data: CategoryInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Category
  deleteCategory(
    documentId: ID!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): DeleteMutationResponse
  createGenre(status: PublicationStatus = PUBLISHED, data: GenreInput!): Genre
  updateGenre(documentId: ID!, status: PublicationStatus = PUBLISHED, data: GenreInput!): Genre
  deleteGenre(documentId: ID!): DeleteMutationResponse
  createLanding(status: PublicationStatus = PUBLISHED, data: LandingInput!): Landing
  updateLanding(documentId: ID!, status: PublicationStatus = PUBLISHED, data: LandingInput!): Landing
  deleteLanding(documentId: ID!): DeleteMutationResponse
  createPage(
    status: PublicationStatus = PUBLISHED
    data: PageInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Page
  updatePage(
    documentId: ID!
    status: PublicationStatus = PUBLISHED
    data: PageInput!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): Page
  deletePage(
    documentId: ID!

    "The locale to use for the query"
    locale: I18NLocaleCode
  ): DeleteMutationResponse
  createPost(status: PublicationStatus = PUBLISHED, data: PostInput!): Post
  updatePost(documentId: ID!, status: PublicationStatus = PUBLISHED, data: PostInput!): Post
  deletePost(documentId: ID!): DeleteMutationResponse
  createTopic(status: PublicationStatus = PUBLISHED, data: TopicInput!): Topic
  updateTopic(documentId: ID!, status: PublicationStatus = PUBLISHED, data: TopicInput!): Topic
  deleteTopic(documentId: ID!): DeleteMutationResponse
  updateUploadFile(id: ID!, info: FileInfoInput): UploadFile!
  deleteUploadFile(id: ID!): UploadFile

  "Create a new role"
  createUsersPermissionsRole(data: UsersPermissionsRoleInput!): UsersPermissionsCreateRolePayload

  "Update an existing role"
  updateUsersPermissionsRole(id: ID!, data: UsersPermissionsRoleInput!): UsersPermissionsUpdateRolePayload

  "Delete an existing role"
  deleteUsersPermissionsRole(id: ID!): UsersPermissionsDeleteRolePayload

  "Create a new user"
  createUsersPermissionsUser(data: UsersPermissionsUserInput!): UsersPermissionsUserEntityResponse!

  "Update an existing user"
  updateUsersPermissionsUser(id: ID!, data: UsersPermissionsUserInput!): UsersPermissionsUserEntityResponse!

  "Delete an existing user"
  deleteUsersPermissionsUser(id: ID!): UsersPermissionsUserEntityResponse!

  login(input: UsersPermissionsLoginInput!): UsersPermissionsLoginPayload!

  "Register a user"
  register(input: UsersPermissionsRegisterInput!): UsersPermissionsLoginPayload!

  "Request a reset password token"
  forgotPassword(email: String!): UsersPermissionsPasswordPayload

  "Reset user password. Confirm with a code (resetToken from forgotPassword)"
  resetPassword(password: String!, passwordConfirmation: String!, code: String!): UsersPermissionsLoginPayload

  "Change user password. Confirm with the current password."
  changePassword(currentPassword: String!, password: String!, passwordConfirmation: String!): UsersPermissionsLoginPayload

  "Confirm an email users email address"
  emailConfirmation(confirmation: String!): UsersPermissionsLoginPayload
}

input ArticleInput {
  title: String
  code: String
  category: ID
  genres: [ID]
  publishedAt: DateTime
}

type DeleteMutationResponse {
  documentId: ID!
}

input AuthorInput {
  name: String
  books: [ID]
  publishedAt: DateTime
  locale: String
}

input BookInput {
  title: String
  pages: Int
  rating: Float
  inStock: Boolean
  publishedOn: Date
  releasedAt: DateTime
  price: ComponentSharedMoneyInput
  editions: [ComponentSharedQuantityInput]
  author: ID
  genres: [ID]
  topic: ID
  category: ID
  cover: ID
  attachments: [ID]
  publishedAt: DateTime
  locale: String
}

input ComponentSharedMoneyInput {
  id: ID
  minor: Long
  currency: String
}

input ComponentSharedQuantityInput {
  id: ID
  amount: Float
  unit: String
}

input CategoryInput {
  name: String
  publishedAt: DateTime
}

input GenreInput {
  name: String
  publishedAt: DateTime
  locale: String
}

input LandingInput {
  title: String
  blocks: [LandingBlocksDynamicZoneInput!]
  publishedAt: DateTime
  locale: String
}

scalar LandingBlocksDynamicZoneInput

input PageInput {
  title: String
  publishedAt: DateTime
}

input PostInput {
  title: String
  views: Int
  topics: [ID]
  author: ID
  image: ID
  publishedAt: DateTime
  locale: String
}

input TopicInput {
  name: String
  publishedAt: DateTime
  locale: String
}

input FileInfoInput {
  name: String
  alternativeText: String
  caption: String
}

input UsersPermissionsRoleInput {
  name: String
  description: String
  type: String
  permissions: [ID]
  users: [ID]
  publishedAt: DateTime
  locale: String
}

type UsersPermissionsCreateRolePayload {
  ok: Boolean!
}

type UsersPermissionsUpdateRolePayload {
  ok: Boolean!
}

type UsersPermissionsDeleteRolePayload {
  ok: Boolean!
}

input UsersPermissionsUserInput {
  username: String
  email: String
  provider: String
  password: String
  resetPasswordToken: String
  confirmationToken: String
  confirmed: Boolean
  blocked: Boolean
  role: ID
  publishedAt: DateTime
  locale: String
}

type UsersPermissionsUserEntityResponse {
  data: UsersPermissionsUser
}

input UsersPermissionsLoginInput {
  identifier: String!
  password: String!
  provider: String! = "local"
}

type UsersPermissionsLoginPayload {
  jwt: String
  user: UsersPermissionsMe!
}

input UsersPermissionsRegisterInput {
  username: String!
  email: String!
  password: String!
}

type UsersPermissionsPasswordPayload {
  ok: Boolean!
}
